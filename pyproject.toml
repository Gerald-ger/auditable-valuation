# Packaging metadata only — no dependency list here on purpose.
# The runtime set lives in backend/requirements.txt and the CI set in
# backend/requirements-test.txt; restating them here would put the same pins in
# two places, which is the problem this change is undoing.
#
# Its job is to make `backend` an importable package rather than a directory
# that only works because uvicorn was started with --app-dir and the test
# conftest edited sys.path. Install with:  pip install -e .
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-analysis-platform"
version = "0.1.0"
# 3.12 because that is where numpy==2.5.1 stops: it declares Python>=3.12, and on 3.11
# the resolve fails on that pin rather than on anything this project wrote. Measured
# 2026-08-28 rather than reasoned about — 3.12.13 and 3.13.14 each install the full
# 107-pin runtime set and pass all 667 offline tests, and ci.yml runs both on every
# push so the floor cannot quietly stop being true. No upper bound: 3.15.0b4 fails
# today because eight packages have no cp315 wheel yet, which is a message pip gives
# clearly and which stops being true on its own.
requires-python = ">=3.12"

[tool.setuptools]
packages = ["backend"]

# Coverage config lives here rather than in a .coveragerc so the repo root does
# not gain a sixteenth file. This is tool configuration, not the dependency list
# the note at the top of this file is about.
[tool.coverage.run]
source = ["backend"]
# The test files' own coverage is always near 100% and says nothing. What this is
# for is the opposite question: which lines of the app nothing reaches.
omit = ["backend/tests/*"]
