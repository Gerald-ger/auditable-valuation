name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          # Required: the pip cache globs for **/requirements.txt or
          # **/pyproject.toml, and this repo has neither name — the dependency
          # files are backend/requirements*.txt. Without this the action errors
          # out before any step runs.
          cache-dependency-path: backend/requirements-test.txt
      - name: Install test dependencies
        # ruff is pinned to the version backend/requirements.post-openbb.txt
        # develops against; unpinned, a new ruff release fails lint on a commit
        # that changed nothing.
        run: pip install -r backend/requirements-test.txt ruff==0.15.22
      - name: Lint
        run: ruff check backend/
      # Network tests are deselected by pytest.ini addopts; the suite runs
      # entirely against the committed fixtures in backend/tests/fixtures/.
      - name: Test
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
